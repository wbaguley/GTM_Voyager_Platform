# Client-specific n8n configuration template
# This file serves as a template for creating client-specific configurations

# Example client configuration (replace {CLIENT_ID} and {CLIENT_SUBDOMAIN} with actual values)
server {
    listen 80;
    server_name {CLIENT_SUBDOMAIN}.gtmvoyager.local;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # Rate limiting for client-specific endpoints
    location / {
        limit_req zone=api burst=10 nodelay;
        
        # Proxy to client-specific n8n instance
        proxy_pass http://n8n-{CLIENT_ID}:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support for n8n
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Client-specific API endpoints
    location /api/client/{CLIENT_ID}/ {
        limit_req zone=api burst=20 nodelay;
        
        # Proxy to GTM Voyager API with client context
        proxy_pass http://gtm_api/api/client/{CLIENT_ID}/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-ID {CLIENT_ID};
    }

    # Webhook endpoints for client automations
    location /webhook/{CLIENT_ID}/ {
        # Allow larger payloads for webhook data
        client_max_body_size 10M;
        
        proxy_pass http://n8n-{CLIENT_ID}:5678/webhook/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
